[project]
name = "career-copilot"
version = "0.1.0"
description = "Local-first Career & Personal Branding Copilot - FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
career-copilot = "career_copilot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
