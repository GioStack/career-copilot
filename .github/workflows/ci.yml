name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
    checks:
      name: Lint and test
      runs-on: ubuntu-latest
      services: 
        postgres:
          image: postgres:18
          env:
            POSTGRES_USER: career_copilot
            POSTGRES_PASSWORD: ci-only-password
            POSTGRES_DB: career_copilot_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U career_copilot -d career_copilot_test"
            --health-interval 5s
            --health-timeout 3s
            --health-retries 5
      env:
        DATABASE_URL: postgresql+psycopg://career_copilot:ci-only-password@127.0.0.1:5432/career_copilot
        TEST_DATABASE_URL: postgresql+psycopg://career_copilot:ci-only-password@127.0.0.1:5432/career_copilot_test

      defaults:
         run:
          working-directory: backend
      steps:
        - name: Check out the code
          uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v9.0.0
          with:
             enable-cache: true
             cache-dependency-glob: backend/uv.lock

        - name: Install project
          run: uv sync --locked

        - name: Check formatting
          run: uv run ruff format --check .
        
        - name: Lint
          run: uv run ruff check .

        - name: Apply migrations
          run: uv run alembic upgrade head
          env: 
            DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        
        - name: Check that the migrations match the models
          run: uv run alembic check
          env: 
            DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        
        - name: Run tests
          run: uv run pytest
