services:
   db:
     image: postgres:18
     env_file:
       - backend/.env

     ports:
       - "127.0.0.1:5432:5432"
     
     volumes:
       - pgdata:/var/lib/postgresql
       - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
      
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
       interval: 5s
       timeout: 3s
       retries: 5

volumes:
    pgdata:
